<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
  <title>Wyścig Szczurów</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 20px;
    }

    .box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
    }

    input, textarea, button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      margin-bottom: 15px;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #222;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    .hidden {
      display: none;
    }
    #map {
  width: 100%;
  height: 400px;
  margin-top: 20px;
  border-radius: 12px;
}
  </style>
</head>

<body>

  <div class="box" id="startScreen">
    <h1>🐀 Wyścig Szczurów 🐀</h1>

    <p>Wpisz dane swojego patrolu:</p>

    <label>Nazwa patrolu</label>
    <input type="text" id="patrolName" placeholder="np. UFOrmowaneKrowy">

    <label>Skład patrolu</label>
    <textarea id="members" placeholder="Wpisz imiona członków patrolu"></textarea>

    <label>Numer alarmowy</label>
    <input type="tel" id="emergencyPhone" placeholder="np. 123 456 789">

    <button onclick="startGame()">ROZPOCZNIJ GRĘ</button>
    <button onclick="showLogin()">MAM KOD PATROLU</button>
  </div>

  <div class="box hidden" id="gameScreen">
    <h1>🗺️ Gra rozpoczęta!</h1>
   <p id="welcome"></p>

<div id="map"></div>
    <div id="ranking" style="margin-top: 20px; padding: 15px; background: white; border-radius: 12px;">
  <h2>🏆 Ranking patroli</h2>
  <div id="rankingList">Ładowanie rankingu...</div>
</div>
    <div id="stationTask" class="hidden">
  <h3 id="stationTaskTitle"></h3>
  <p id="stationTaskDescription"></p>
  <button onclick="completeStation()">
    Wykonaliśmy zadanie
  </button>
</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://ozotiydwyrmrepetvpbh.supabase.co";

  const SUPABASE_KEY = "sb_publishable_yxPju_eBSScU-StHJ57A9A_7VHADiI7";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  function showLogin() {
    document.getElementById("startScreen").innerHTML = `
      <h1>🐀 Wyścig Szczurów</h1>

      <p>Masz już kod patrolu?</p>

      <input
        type="text"
        id="accessCode"
        placeholder="Wpisz kod patrolu"
      >

      <button onclick="loginPatrol()">WEJDŹ DO GRY</button>

      <p style="text-align:center;">
        Nie masz jeszcze patrolu?
        <button onclick="location.reload()">UTWÓRZ NOWY PATROL</button>
      </p>
    `;
  }

 async function loginPatrol() {
  const code = document
    .getElementById("accessCode")
    .value
    .trim()
    .toUpperCase();

  if (!code) {
    alert("Wpisz kod patrolu.");
    return;
  }

  const { data, error } = await supabaseClient.rpc(
    "login_patrol",
    {
      p_access_code: code
    }
  );

  if (error) {
    console.error(error);
    alert("Błąd logowania: " + error.message);
    return;
  }

  if (!data || data.length === 0) {
    alert("Nie znaleziono patrolu o takim kodzie.");
    return;
  }

  const patrol = data[0];

document.getElementById("startScreen").classList.add("hidden");
document.getElementById("gameScreen").classList.remove("hidden");

showMap();

  document.getElementById("welcome").innerHTML =
    "Witaj ponownie, patrolu <strong>" +
    patrol.name +
    "!</strong><br><br>" +
    "👥 Skład: " +
    patrol.members +
    "<br><br>" +
    "🏆 Punkty: " +
    patrol.points;

   startGPS();
   loadRanking();
}
  async function startGame() {
    const patrolName = document.getElementById("patrolName").value.trim();
    const members = document.getElementById("members").value.trim();
    const emergencyPhone = document.getElementById("emergencyPhone").value.trim();

    if (!patrolName || !members || !emergencyPhone) {
      alert("Uzupełnij wszystkie pola.");
      return;
    }

    const button = document.querySelector("#startScreen button");
    button.disabled = true;
    button.textContent = "ZAPISYWANIE...";

    const { data, error } = await supabaseClient.rpc(
      "register_patrol",
      {
        p_name: patrolName,
        p_members: members,
        p_emergency_phone: emergencyPhone
      }
    );

    if (error) {
      console.error(error);
      alert("Nie udało się zapisać patrolu: " + error.message);
      button.disabled = false;
      button.textContent = "ROZPOCZNIJ GRĘ";
      return;
    }

    const patrol = data[0];

    window.patrolId = patrol.patrol_id;

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("gameScreen").classList.remove("hidden");

    document.getElementById("welcome").innerHTML =
      "Witaj, patrolu <strong>" +
      patrolName +
      "!</strong><br><br>" +
      "🔐 Wasz kod dostępu:<br>" +
      "<strong style='font-size: 28px;'>" +
      patrol.access_code +
      "</strong><br><br>" +
      "Zapiszcie ten kod. Będzie potrzebny do wejścia do gry.";
  }
</script>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  let map;

async function showMap() {
    if (map) return;

    map = L.map("map").setView([54.4550, 18.4700], 14);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
   const { data: stations, error } = await supabaseClient.rpc(
  "get_stations"
);

  window.stations = stations;

if (error) {
  console.error("Błąd pobierania punktów:", error);
  return;
}

stations.forEach(station => {
  L.circleMarker(
    [station.latitude, station.longitude],
    {
      radius: 9,
      color: station.color,
      fillColor: station.color,
      fillOpacity: 1
    }
  )
    .addTo(map)
      .bindTooltip(station.name);
});
  }
</script>

<script>
function distanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) * Math.sin(dLon / 2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}
</script>

  <script>
    async function loadRanking() {
  const { data, error } = await supabaseClient
    .from("patrols")
    .select("name, points")
    .order("points", { ascending: false })
    .order("name", { ascending: true });

  if (error) {
    console.error("Błąd pobierania rankingu:", error);
    document.getElementById("rankingList").textContent =
      "Nie udało się pobrać rankingu.";
    return;
  }

  const rankingList = document.getElementById("rankingList");

  rankingList.innerHTML = "";

  data.forEach((patrol, index) => {
    const row = document.createElement("div");

    row.textContent =
      (index + 1) + ". " + patrol.name + " — " + patrol.points + " pkt";

    rankingList.appendChild(row);
  });
}
function startGPS() {
  if (!navigator.geolocation) {
    alert("Ta przeglądarka nie obsługuje GPS.");
    return;
  }

 navigator.geolocation.watchPosition(
  async position => {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;

      console.log("GPS patrolu:", latitude, longitude);
      if (window.stations) {
  window.stations.forEach(station => {
    const distance = distanceInMeters(
      latitude,
      longitude,
      station.latitude,
      station.longitude
    );

if (distance <= station.activation_radius) {
  if (window.activeStationId === station.id) {
  return;
}

window.activeStationId = station.id;
  const { data, error } = await supabaseClient.rpc(
    "get_station_task",
    {
      p_station_id: station.id
    }
  );

  if (error) {
    console.error("Błąd pobierania zadania:", error);
    return;
  }

  if (!data || data.length === 0) {
    return;
  }

  const task = data[0];

  console.log("Typ punktu:", task.type);

  window.currentStation = task;

  document.getElementById("stationTask").classList.remove("hidden");

  document.getElementById("stationTaskTitle").textContent =
    "📍 " + task.name;

  document.getElementById("stationTaskDescription").textContent =
    task.description;
}
  });
}
     if (!window.patrolMarker) {
  const ratIcon = L.divIcon({
    className: "",
    html: '<div style="font-size: 30px; text-shadow: 0 0 0 white, 2px 2px 0 white, -2px -2px 0 white, 2px -2px 0 white, -2px 2px 0 white;">🐀</div>',
    iconSize: [35, 35],
    iconAnchor: [17, 17]
  });

  window.patrolMarker = L.marker(
    [latitude, longitude],
    { icon: ratIcon }
  ).addTo(map);
} else {
  window.patrolMarker.setLatLng([latitude, longitude]);
}
    },
    error => {
      console.error("Błąd GPS:", error);
      alert("Nie udało się pobrać lokalizacji. Sprawdź zgodę na lokalizację.");
    },
    {
      enableHighAccuracy: true,
      maximumAge: 5000,
      timeout: 10000
    }
  );
}
</script>
  <script>
async function completeStation() {
  if (!window.currentStation) {
    alert("Nie wybrano punktu.");
    return;
  }

  if (!window.patrolId) {
    alert("Brak danych patrolu. Zalogujcie się ponownie.");
    return;
  }

 let password = null;

if (window.currentStation.type === "osobowy") {
  password = prompt("🔑 Podaj hasło otrzymane od punktowego:");

  if (password === null) {
    return;
  }
}

const { data, error } = await supabaseClient.rpc(
  "complete_station",
  {
    p_patrol_id: window.patrolId,
    p_station_id: window.currentStation.id,
    p_password: password
  }
);

  if (error) {
    console.error("Błąd zaliczania punktu:", error);
    alert("Nie udało się zaliczyć punktu.");
    return;
  }

  const result = data[0];

  if (!result.success) {
    alert("ℹ️ " + result.message);
    return;
  }

  document.getElementById("stationTask").classList.add("hidden");
  window.activeStationId = null;
window.currentStation = null;

  alert(
    "🎉 " +
    result.message +
    "\n\n🏆 +" +
    result.points_added +
    " punktów" +
    (result.letter ? "\n🔤 Litera: " + result.letter : "")
  );
}
</script>
  
</body>
</html>
